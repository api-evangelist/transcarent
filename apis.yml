name: Transcarent
description: >-
  Transcarent is a health and care experience company serving self-insured
  employers, health plans, and government and labor union clients. Its
  consumer-facing platform, WayFinding, combines generative AI agents with
  instant access to human health guides and clinicians to deliver benefits
  navigation, clinical guidance, virtual primary and specialty care, pharmacy
  care, surgery care, cancer care, weight-health programs, and 2nd.MD second
  opinions in a single experience. The platform is built on an API-first,
  cloud-native architecture with pre-built HL7 FHIR and EDI connectors that
  integrate with existing eligibility files and medical, pharmacy, and
  point-solution benefits. Transcarent exposes these integrations to enterprise
  partners rather than through a public self-serve developer API or
  documentation portal.
